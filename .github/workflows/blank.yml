          CLAUDETV_EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: claude-tv
        run: gradle :app:assembleDebug --no-daemon

      - name: Publish the APK as a download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp claude-tv/app/build/outputs/apk/debug/app-debug.apk claude-tv.apk
          gh release delete tv-app --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create tv-app claude-tv.apk -R "$GITHUB_REPOSITORY" \
            --title "Claude TV" --latest \
            --notes "Download claude-tv.apk and install it on your Google TV."
          echo "APK link: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/claude-tv.apk" >> "$GITHUB_STEP_SUMMARY"

