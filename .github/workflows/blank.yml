# Builds the "Claude TV" app for Google TV / Android TV and publishes the APK
# as a GitHub Release so the TV can download it.
# Add this file to a new GitHub repository at: .github/workflows/build.yml
name: Build Claude TV

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the app's source files
        run: |
          mkdir -p claude-tv claude-tv/app claude-tv/app/src/main claude-tv/app/src/main/java/com/personal/claudetv claude-tv/app/src/main/res/drawable claude-tv/app/src/main/res/values
          cat > claude-tv/app/build.gradle <<'CLAUDETV_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.personal.claudetv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.personal.claudetv'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          CLAUDETV_EOF
          cat > claude-tv/app/src/main/AndroidManifest.xml <<'CLAUDETV_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <!-- TV app: no touchscreen needed; works on Google TV / Android TV -->
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:banner="@drawable/banner"
                  android:icon="@drawable/icon"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          CLAUDETV_EOF
          cat > claude-tv/app/src/main/java/com/personal/claudetv/MainActivity.java <<'CLAUDETV_EOF'
          package com.personal.claudetv;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.InputDevice;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /**
           * Claude TV: shows claude.ai full screen on Google TV / Android TV and turns the
           * remote's D-pad into an on-screen mouse pointer.
           *
           * Remote controls:
           *   Arrows        move the pointer (hold to speed up; push against the top/bottom edge to scroll)
           *   OK / Enter    click (opens the on-screen keyboard when you click a text box)
           *   Back          go back a page; press twice on the first page to exit
           *   CH+ / CH-     scroll up / down a page (also Page Up / Page Down)
           *   Red / Green   smaller / bigger text (also Rewind / Fast-forward)
           */
          public class MainActivity extends Activity {

              private static final String HOME_URL = "https://claude.ai/";
              private static final String PREFS = "claude_tv";
              private static final String PREF_TEXT_ZOOM = "text_zoom";
              private static final int REQ_MIC = 42;
              private static final long CURSOR_HIDE_MS = 6000;

              private WebView webView;
              private CursorView cursor;
              private SharedPreferences prefs;

              private float cursorX;
              private float cursorY;
              private long touchDownTime;
              private boolean touchActive;
              private long lastBackPress;
              private PermissionRequest pendingPermission;

              private final Runnable hideCursor = new Runnable() {
                  @Override
                  public void run() {
                      if (cursor != null) {
                          cursor.setVisibility(View.INVISIBLE);
                      }
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(38, 38, 36));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(38, 38, 36));
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  root.addView(webView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  cursor = new CursorView(this);
                  cursor.setFocusable(false);
                  cursor.setClickable(false);
                  root.addView(cursor, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  setContentView(root);
                  configureWebView();

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(HOME_URL);
                  }

                  root.post(new Runnable() {
                      @Override
                      public void run() {
                          View r = (View) cursor.getParent();
                          cursorX = r.getWidth() / 2f;
                          cursorY = r.getHeight() / 2f;
                          cursor.moveTo(cursorX, cursorY);
                          showCursor();
                      }
                  });
                  webView.requestFocus();
              }

              private void configureWebView() {
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setSupportMultipleWindows(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setTextZoom(prefs.getInt(PREF_TEXT_ZOOM, 100));
                  s.setUserAgentString(desktopUserAgent(s.getUserAgentString()));

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) {
                              return false; // keep normal web links inside the app
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (ActivityNotFoundException e) {
                              toast("Can't open that link on this TV");
                          }
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              String html = "<html><body style='background:#262624;color:#eee;font-family:sans-serif;"
                                      + "display:flex;flex-direction:column;align-items:center;justify-content:center;height:90vh'>"
                                      + "<h2>Can't reach claude.ai</h2><p>Check the TV's internet connection.</p>"
                                      + "<button style='font-size:24px;padding:12px 32px' "
                                      + "onclick=\"location.href='" + HOME_URL + "'\">Try again</button></body></html>";
                              view.loadDataWithBaseURL(null, html, "text/html", "utf-8", null);
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  handlePermission(request);
                              }
                          });
                      }
                  });
              }

              /** Present as desktop Chrome (same engine version) so claude.ai serves its full web app. */
              private static String desktopUserAgent(String defaultUa) {
                  String version = "130.0.0.0";
                  Matcher m = Pattern.compile("Chrome/([0-9.]+)").matcher(defaultUa == null ? "" : defaultUa);
                  if (m.find()) {
                      version = m.group(1);
                  }
                  return "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/"
                          + version + " Safari/537.36";
              }

              // ---------- Microphone (for voice features on claude.ai, if the TV has a mic) ----------

              private void handlePermission(PermissionRequest request) {
                  String host = request.getOrigin() == null ? "" : String.valueOf(request.getOrigin().getHost());
                  boolean trusted = host.equals("claude.ai") || host.endsWith(".claude.ai");
                  boolean wantsAudio = false;
                  for (String r : request.getResources()) {
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) {
                          wantsAudio = true;
                      }
                  }
                  if (!trusted || !wantsAudio) {
                      request.deny();
                      return;
                  }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                  } else {
                      pendingPermission = request;
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_MIC);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] results) {
                  super.onRequestPermissionsResult(requestCode, permissions, results);
                  if (requestCode == REQ_MIC && pendingPermission != null) {
                      if (results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED) {
                          pendingPermission.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                      } else {
                          pendingPermission.deny();
                      }
                      pendingPermission = null;
                  }
              }

              // ---------- Remote control handling ----------

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int code = event.getKeyCode();
                  int action = event.getAction();
                  boolean down = action == KeyEvent.ACTION_DOWN;

                  switch (code) {
                      case KeyEvent.KEYCODE_DPAD_UP:
                      case KeyEvent.KEYCODE_DPAD_DOWN:
                      case KeyEvent.KEYCODE_DPAD_LEFT:
                      case KeyEvent.KEYCODE_DPAD_RIGHT:
                          if (down) {
                              moveCursor(code, event.getRepeatCount());
                          }
                          return true;

                      case KeyEvent.KEYCODE_DPAD_CENTER:
                      case KeyEvent.KEYCODE_ENTER:
                      case KeyEvent.KEYCODE_NUMPAD_ENTER:
                      case KeyEvent.KEYCODE_BUTTON_A:
                          showCursor();
                          if (down && event.getRepeatCount() == 0) {
                              sendTouch(MotionEvent.ACTION_DOWN);
                          } else if (action == KeyEvent.ACTION_UP) {
                              sendTouch(MotionEvent.ACTION_UP);
                          }
                          return true;

                      case KeyEvent.KEYCODE_BACK:
                          if (action == KeyEvent.ACTION_UP) {
                              handleBack();
                          }
                          return true;

                      case KeyEvent.KEYCODE_CHANNEL_UP:
                      case KeyEvent.KEYCODE_PAGE_UP:
                          if (down) {
                              showCursor();
                              scrollAtCursor(0, 8f);
                          }
                          return true;

                      case KeyEvent.KEYCODE_CHANNEL_DOWN:
                      case KeyEvent.KEYCODE_PAGE_DOWN:
                          if (down) {
                              showCursor();
                              scrollAtCursor(0, -8f);
                          }
                          return true;

                      case KeyEvent.KEYCODE_PROG_RED:
                      case KeyEvent.KEYCODE_MEDIA_REWIND:
                      case KeyEvent.KEYCODE_ZOOM_OUT:
                          if (down && event.getRepeatCount() == 0) {
                              changeTextZoom(-10);
                          }
                          return true;

                      case KeyEvent.KEYCODE_PROG_GREEN:
                      case KeyEvent.KEYCODE_MEDIA_FAST_FORWARD:
                      case KeyEvent.KEYCODE_ZOOM_IN:
                          if (down && event.getRepeatCount() == 0) {
                              changeTextZoom(10);
                          }
                          return true;

                      default:
                          return super.dispatchKeyEvent(event);
                  }
              }

              private void moveCursor(int code, int repeat) {
                  showCursor();
                  View root = (View) cursor.getParent();
                  float w = root.getWidth();
                  float h = root.getHeight();
                  float density = getResources().getDisplayMetrics().density;
                  float step = 9f * density * Math.min(1f + repeat * 0.35f, 5f);
                  float margin = 2f * density;
                  float scrollAmount = Math.min(1f + repeat * 0.25f, 4f);

                  switch (code) {
                      case KeyEvent.KEYCODE_DPAD_UP:
                          if (cursorY <= margin) {
                              scrollAtCursor(0, scrollAmount);
                          } else {
                              cursorY = Math.max(margin, cursorY - step);
                          }
                          break;
                      case KeyEvent.KEYCODE_DPAD_DOWN:
                          if (cursorY >= h - margin) {
                              scrollAtCursor(0, -scrollAmount);
                          } else {
                              cursorY = Math.min(h - margin, cursorY + step);
                          }
                          break;
                      case KeyEvent.KEYCODE_DPAD_LEFT:
                          if (cursorX <= margin) {
                              scrollAtCursor(scrollAmount, 0);
                          } else {
                              cursorX = Math.max(margin, cursorX - step);
                          }
                          break;
                      case KeyEvent.KEYCODE_DPAD_RIGHT:
                          if (cursorX >= w - margin) {
                              scrollAtCursor(-scrollAmount, 0);
                          } else {
                              cursorX = Math.min(w - margin, cursorX + step);
                          }
                          break;
                      default:
                          break;
                  }
                  cursor.moveTo(cursorX, cursorY);
                  if (touchActive) {
                      sendTouch(MotionEvent.ACTION_MOVE);
                  } else {
                      sendMouse(MotionEvent.ACTION_HOVER_MOVE, 0, 0);
                  }
              }

              /** Positive v scrolls up (content moves down), matching a mouse wheel. */
              private void scrollAtCursor(float h, float v) {
                  sendMouse(MotionEvent.ACTION_SCROLL, h, v);
              }

              private void sendMouse(int action, float hScroll, float vScroll) {
                  long now = SystemClock.uptimeMillis();
                  MotionEvent.PointerProperties[] props = {new MotionEvent.PointerProperties()};
                  props[0].id = 0;
                  props[0].toolType = MotionEvent.TOOL_TYPE_MOUSE;
                  MotionEvent.PointerCoords[] coords = {new MotionEvent.PointerCoords()};
                  coords[0].x = cursorX;
                  coords[0].y = cursorY;
                  coords[0].pressure = 0f;
                  coords[0].size = 1f;
                  coords[0].setAxisValue(MotionEvent.AXIS_HSCROLL, hScroll);
                  coords[0].setAxisValue(MotionEvent.AXIS_VSCROLL, vScroll);
                  MotionEvent ev = MotionEvent.obtain(now, now, action, 1, props, coords,
                          0, 0, 1f, 1f, 0, 0, InputDevice.SOURCE_MOUSE, 0);
                  webView.dispatchGenericMotionEvent(ev);
                  ev.recycle();
              }

              private void sendTouch(int action) {
                  long now = SystemClock.uptimeMillis();
                  if (action == MotionEvent.ACTION_DOWN) {
                      touchDownTime = now;
                      touchActive = true;
                      webView.requestFocus();
                  } else if (!touchActive) {
                      return;
                  }
                  MotionEvent ev = MotionEvent.obtain(touchDownTime, now, action, cursorX, cursorY, 0);
                  ev.setSource(InputDevice.SOURCE_TOUCHSCREEN);
                  webView.dispatchTouchEvent(ev);
                  ev.recycle();
                  if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                      touchActive = false;
                  }
              }

              private void handleBack() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                      return;
                  }
                  long now = SystemClock.uptimeMillis();
                  if (now - lastBackPress < 2000) {
                      finish();
                  } else {
                      lastBackPress = now;
                      toast("Press Back again to exit");
                  }
              }

              private void changeTextZoom(int delta) {
                  WebSettings s = webView.getSettings();
                  int zoom = Math.max(60, Math.min(250, s.getTextZoom() + delta));
                  s.setTextZoom(zoom);
                  prefs.edit().putInt(PREF_TEXT_ZOOM, zoom).apply();
                  toast("Text size " + zoom + "%");
              }

              private void showCursor() {
                  cursor.setVisibility(View.VISIBLE);
                  cursor.removeCallbacks(hideCursor);
                  cursor.postDelayed(hideCursor, CURSOR_HIDE_MS);
              }

              private void toast(String msg) {
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
              }

              // ---------- Lifecycle ----------

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  webView.saveState(outState);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  webView.onResume();
              }

              @Override
              protected void onPause() {
                  CookieManager.getInstance().flush();
                  webView.onPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }

              // ---------- On-screen pointer ----------

              private static class CursorView extends View {
                  private final Paint fill = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint stroke = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final float radius;
                  private float x = -100f;
                  private float y = -100f;

                  CursorView(Context context) {
                      super(context);
                      float d = context.getResources().getDisplayMetrics().density;
                      radius = 9f * d;
                      fill.setColor(Color.argb(220, 255, 255, 255));
                      fill.setStyle(Paint.Style.FILL);
                      stroke.setColor(Color.rgb(224, 122, 79));
                      stroke.setStyle(Paint.Style.STROKE);
                      stroke.setStrokeWidth(3f * d);
                  }

                  void moveTo(float nx, float ny) {
                      x = nx;
                      y = ny;
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      canvas.drawCircle(x, y, radius, fill);
                      canvas.drawCircle(x, y, radius, stroke);
                  }
              }
          }
          CLAUDETV_EOF
          cat > claude-tv/app/src/main/res/drawable/banner.xml <<'CLAUDETV_EOF'
